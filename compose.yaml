services:
  api:
    build: .
    image: stockpredictor:local
    init: true
    restart: unless-stopped
    command: ["stockpredictor", "api", "--config", "configs/default.example.yaml", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["stockpredictor-data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12
  dashboard:
    image: stockpredictor:local
    build: .
    init: true
    restart: unless-stopped
    command: ["stockpredictor", "dashboard", "--config", "configs/default.example.yaml", "--host", "0.0.0.0", "--server-port", "8501"]
    ports: ["127.0.0.1:8501:8501"]
    volumes: ["stockpredictor-data:/app/data"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12
volumes:
  stockpredictor-data:
