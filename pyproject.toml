[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpredictor"
version = "0.1.0"
description = "Configuration-first stock prediction and trading intelligence research suite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.5",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.0",
    "plotly>=7.1.0",
    "pydantic>=2.14.1",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.15.0",
    "streamlit>=1.65.0",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.1",
    # Browser UI diagnosis (Streamlit dashboard at :8501): after installing, run: python -m playwright install chromium
    "playwright>=1.64.0",
]

[project.scripts]
stockpredictor = "stockpredictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
extend-exclude = ["finance_app.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
